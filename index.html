<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Arcade — Games Built with Po</title>
<meta name="description" content="A hub for the single-file web games built with Po. Pick one and play.">
<style>
  :root{
    --bg:#0b1026;
    --bg2:#131a3a;
    --card:#151c40;
    --ink:#f4f6ff;
    --muted:#9aa3c7;
    --accent:#7c6cff;
    --glow:rgba(124,108,255,.45);
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 80% -10%,#1b2350 0%,var(--bg) 55%) fixed, var(--bg);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  #fx{position:fixed;inset:0;z-index:50;pointer-events:none}

  .wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px 80px}

  /* ---------- HERO ---------- */
  header{
    text-align:center;
    padding:72px 16px 30px;
  }
  .kicker{
    display:inline-block;
    font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);
    border:1px solid #2a3568;border-radius:999px;padding:8px 18px;margin-bottom:22px;
    background:rgba(21,28,64,.6);backdrop-filter:blur(6px);
  }
  h1{
    font-size:clamp(44px,8vw,92px);
    font-weight:900;line-height:1.02;letter-spacing:-.02em;
    background:linear-gradient(92deg,#ffd166 0%,#ff7b7b 30%,#c77dff 60%,#7c6cff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 24px rgba(199,125,255,.25));
  }
  h1 .coin{display:inline-block;animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-10px) rotate(8deg)}}
  .sub{margin-top:16px;color:var(--muted);font-size:clamp(15px,2.4vw,19px);max-width:640px;margin-left:auto;margin-right:auto;line-height:1.55}
  .sub b{color:var(--ink)}

  .hero-btns{margin-top:28px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{
    appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;
    padding:14px 28px;border-radius:999px;color:#0b1026;
    background:linear-gradient(135deg,#ffd166,#ff9f5a);
    box-shadow:0 8px 28px rgba(255,159,90,.35),inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 34px rgba(255,159,90,.5)}
  .btn:active{transform:scale(.96)}
  .btn.ghost{
    background:rgba(21,28,64,.7);color:var(--ink);
    border:1px solid #2a3568;box-shadow:none;
  }
  .btn.ghost:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(124,108,255,.3)}

  /* ---------- FILTERS ---------- */
  .filters{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    margin:38px 0 26px;
  }
  .chip{
    cursor:pointer;border:1px solid #2a3568;background:rgba(21,28,64,.6);color:var(--muted);
    font:inherit;font-size:13.5px;font-weight:600;letter-spacing:.04em;
    padding:9px 18px;border-radius:999px;transition:all .18s ease;
  }
  .chip:hover{color:var(--ink);border-color:#4a589a;transform:translateY(-1px)}
  .chip.on{background:linear-gradient(135deg,var(--accent),#5a8cff);color:#fff;border-color:transparent;box-shadow:0 6px 18px var(--glow)}

  /* ---------- GRID ---------- */
  .grid{
    display:grid;gap:22px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  }
  @media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}

  .card{
    position:relative;display:flex;flex-direction:column;
    background:linear-gradient(160deg,var(--card),#10173a);
    border:1px solid #263063;border-radius:var(--radius);
    padding:26px 22px 22px;overflow:hidden;
    text-decoration:none;color:inherit;
    transform-style:preserve-3d;
    transition:box-shadow .2s ease,border-color .2s ease,opacity .25s ease,transform .25s ease;
    will-change:transform;
  }
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
    background:radial-gradient(420px 220px at var(--mx,50%) var(--my,0%),var(--tint,rgba(124,108,255,.16)),transparent 70%);
    transition:opacity .2s;
  }
  .card:hover{border-color:var(--tint2,#4a589a);box-shadow:0 18px 50px -12px var(--tint2,#4a589a)}
  .card.hidden{display:none}
  .card.pop{animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

  .icon{
    font-size:44px;line-height:1;width:74px;height:74px;border-radius:20px;
    display:grid;place-items:center;margin-bottom:18px;
    background:rgba(255,255,255,.05);border:1px solid #2a3568;
    transform:translateZ(30px);overflow:hidden;
  }
  .icon img{width:100%;height:100%;object-fit:cover;display:block}
  .card h2{font-size:21px;letter-spacing:.02em;margin-bottom:8px;transform:translateZ(24px)}
  .card p{color:var(--muted);font-size:14.5px;line-height:1.55;flex:1;transform:translateZ(16px)}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 18px;transform:translateZ(12px)}
  .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c9d1f5;
       background:rgba(124,108,255,.14);border:1px solid rgba(124,108,255,.35);border-radius:999px;padding:5px 11px}
  .play{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-weight:800;font-size:15px;letter-spacing:.03em;
    color:#0b1026;background:linear-gradient(135deg,var(--tint3,#ffd166),#fff2);
    background:linear-gradient(135deg,var(--tint3,#ffd166),var(--tint4,#ff9f5a));
    border-radius:12px;padding:13px;transform:translateZ(20px);
    transition:transform .15s ease,filter .15s ease;
  }
  .card:hover .play{filter:brightness(1.08)}
  .card:active .play{transform:translateZ(20px) scale(.97)}
  .play .arrow{transition:transform .2s ease}
  .card:hover .play .arrow{transform:translateX(4px)}

  /* ---------- TOAST ---------- */
  #toast{
    display:none;
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,140px);
    background:#1a2247;border:1px solid #3a4785;color:var(--ink);
    padding:14px 24px;border-radius:999px;font-weight:700;font-size:15px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:60;
    transition:transform .35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;max-width:92vw;
    overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{transform:translate(-50%,0)}

  footer{
    text-align:center;color:var(--muted);font-size:13.5px;margin-top:64px;line-height:1.8;
  }
  footer .hint{opacity:.75}
  footer kbd{background:#1a2247;border:1px solid #2a3568;border-radius:6px;padding:2px 8px;font-family:inherit;font-size:12px}

  @media(max-width:560px){
    header{padding:52px 12px 22px}
    .card{padding:22px 18px 18px}
    .grid{grid-template-columns:1fr}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="fx"></canvas>

<div class="wrap">
  <header>
    <div class="kicker">single-file web games</div>
    <h1><span class="coin">🕹️</span> THE ARCADE</h1>
    <p class="sub">Every game here was <b>built with Po</b> — one HTML file each, zero installs, runs right in your browser. Pick your poison, or let fate decide.</p>
    <div class="hero-btns">
      <button class="btn" id="surprise">🎲 Surprise me</button>
      <button class="btn ghost" id="allPlay" title="Open every game in a new tab">Open all games</button>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter games by genre"></nav>

  <main class="grid" id="grid"></main>

  <footer>
    <div>Made with ⚡ by <b>Po</b> &amp; friends. More games are always on the way.</div>
    <div class="hint">Psst — try the Konami code: <kbd>↑↑↓↓←→←→</kbd> <kbd>B</kbd> <kbd>A</kbd></div>
  </footer>
</div>

<div id="toast" role="status"></div>

<script>
"use strict";
/* ==================== DATA ==================== */
const GAMES = [
  { name:"BROADSIDE", icon:"⚓",
    desc:"Command a fleet in 1453. Broadside-only guns, real wind and tacking, shore batteries to silence.",
    tags:["Strategy","Naval"], url:"https://pete1450.github.io/Broadside/",
    tint:"rgba(90,255,170,.16)", tint2:"rgba(90,255,170,.55)", grad:["#5affaa","#1fbf6b"] },
  { name:"A MILLION BADGUYS", icon:"👹", img:"a-million-badguys.png",
    desc:"A million bad guys are marching down the lane. Position the mob, grab the banners, hold the line.",
    tags:["Action","Lane defense"], url:"https://pete1450.github.io/a-million-badguys/",
    tint:"rgba(255,90,90,.16)", tint2:"rgba(255,90,90,.55)", grad:["#ff8a5a","#e23c3c"] },
  { name:"SAIL", icon:"⛵",
    desc:"Take the helm of a gaff-rigged boat. Trim the sheets, walk the deck, ride out a heavy storm.",
    tags:["Simulation","Sailing"], url:"https://pete1450.github.io/Sail/",
    tint:"rgba(90,160,255,.16)", tint2:"rgba(90,160,255,.55)", grad:["#7cc4ff","#2f7fe0"] },
  { name:"MESHCORE - THE GAME", icon:"🗼",
    desc:"Walk a 3D topo valley in first person. Drop repeaters, scan the terrain, link all twelve people.",
    tags:["Strategy","Exploration"], url:"https://pete1450.github.io/Meshcore-TheGame/",
    tint:"rgba(255,210,90,.16)", tint2:"rgba(255,210,90,.55)", grad:["#ffe08a","#d9a62e"] },
  { name:"FLING THE STATE", icon:"🗺️",
    desc:"Fling all 50 states back into their slots with a tabletop slingshot. Four levels of aiming chaos.",
    tags:["Puzzle","Geography"], url:"https://pete1450.github.io/Fling-the-State/",
    tint:"rgba(170,120,255,.16)", tint2:"rgba(170,120,255,.55)", grad:["#c9a0ff","#7c4fe0"] },
  { name:"ROBOT RAMPAGE", icon:"🤖",
    desc:"Smash the city block by block. Punch buildings, eat civilians, swat the helicopters.",
    tags:["Action","Arcade"], url:"https://pete1450.github.io/RobotRampage/",
    tint:"rgba(255,120,200,.16)", tint2:"rgba(255,120,200,.55)", grad:["#ff9ad5","#c23a8c"] },
  { name:"CAMPGROUND TYCOON", icon:"🏕️",
    desc:"Build the lakeside campground of your dreams — sites, amenities, guests, and glowing ratings.",
    tags:["Simulation","Tycoon"], url:"https://pete1450.github.io/LakeviewCampsite-TheGame/",
    tint:"rgba(120,220,140,.16)", tint2:"rgba(120,220,140,.55)", grad:["#a4ec8a","#3fae4e"] },
  { name:"STILLWATER", icon:"🛶",
    desc:"No scores, no enemies. Drift a dreamy canal at sunset to generative ambient music.",
    tags:["Chill","Ambient"], url:"https://pete1450.github.io/Stillwater/",
    tint:"rgba(255,190,140,.16)", tint2:"rgba(255,190,140,.55)", grad:["#ffc59a","#e08a4f"] },
  { name:"LIGHT/SPLIT", icon:"🌈",
    desc:"Bend beams of colored light across a 10×10 board. Split, combine, and route every color home.",
    tags:["Puzzle","Logic"], url:"https://pete1450.github.io/Light-Split/",
    tint:"rgba(140,220,255,.16)", tint2:"rgba(140,220,255,.55)", grad:["#a0e8ff","#6c7cff"] },
  { name:"JUST ONE TRIM", icon:"🪴",
    desc:"A voxel bonsai that grows while you're away. Prune, shape, and tend your tiny tree.",
    tags:["Simulation","Chill"], url:"https://pete1450.github.io/just-one-trim/",
    tint:"rgba(120,230,180,.16)", tint2:"rgba(120,230,180,.55)", grad:["#9fe8c8","#3cae7c"] },
  { name:"ISOBREAKER", icon:"🧊",
    desc:"Pilot an icebreaker through frozen seas. Smash the ice, carve your path, keep moving.",
    tags:["Simulation","Arcade"], url:"https://pete1450.github.io/isobreaker/",
    tint:"rgba(170,225,255,.16)", tint2:"rgba(170,225,255,.55)", grad:["#cfeeff","#5fb8e8"] },
];
const ALL_TAGS = ["All", ...new Set(GAMES.flatMap(g=>g.tags))];

/* ==================== STARFIELD ==================== */
const stars = document.getElementById("stars");
const sctx = stars.getContext("2d");
let motes = [], shooters = [];
function sizeStars(){
  stars.width = innerWidth; stars.height = innerHeight;
  motes = Array.from({length: Math.min(220, innerWidth*innerHeight/9000)}, () => ({
    x:Math.random()*stars.width, y:Math.random()*stars.height,
    r:Math.random()*1.6+.4, s:Math.random()*.25+.05,
    tw:Math.random()*Math.PI*2, ts:Math.random()*.02+.005,
    c:Math.random()<.12 ? "#ffd166" : (Math.random()<.2 ? "#c77dff" : "#aab6ff")
  }));
}
function tickStars(t){
  sctx.clearRect(0,0,stars.width,stars.height);
  for(const m of motes){
    m.y += m.s; if(m.y > stars.height+4){ m.y = -4; m.x = Math.random()*stars.width; }
    m.tw += m.ts;
    sctx.globalAlpha = .35 + Math.abs(Math.sin(m.tw))*.55;
    sctx.fillStyle = m.c;
    sctx.beginPath(); sctx.arc(m.x, m.y, m.r, 0, 7); sctx.fill();
  }
  sctx.globalAlpha = 1;
  // occasional shooting star
  if(Math.random() < .006 && shooters.length < 2){
    shooters.push({x:Math.random()*stars.width*.7+stars.width*.15, y:-20, vx:-6-Math.random()*4, vy:3+Math.random()*2, life:1});
  }
  shooters = shooters.filter(s=>{
    s.x += s.vx; s.y += s.vy; s.life -= .012;
    if(s.life<=0) return false;
    const g = sctx.createLinearGradient(s.x, s.y, s.x - s.vx*12, s.y - s.vy*12);
    g.addColorStop(0, "rgba(255,255,255,"+(.9*s.life)+")");
    g.addColorStop(1, "rgba(255,255,255,0)");
    sctx.strokeStyle = g; sctx.lineWidth = 2;
    sctx.beginPath(); sctx.moveTo(s.x, s.y); sctx.lineTo(s.x - s.vx*12, s.y - s.vy*12); sctx.stroke();
    return true;
  });
  requestAnimationFrame(tickStars);
}
addEventListener("resize", sizeStars);
sizeStars(); requestAnimationFrame(tickStars);

/* ==================== CONFETTI ==================== */
const fx = document.getElementById("fx");
const fctx = fx.getContext("2d");
function sizeFx(){ fx.width = innerWidth; fx.height = innerHeight; }
addEventListener("resize", sizeFx); sizeFx();
let bits = [], fxRunning = false;
const COLORS = ["#ffd166","#ff7b7b","#c77dff","#7c6cff","#5affaa","#7cc4ff","#ff9ad5"];
function boom(x, y, n){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = Math.random()*9+3;
    bits.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 4,
      w:Math.random()*8+4, h:Math.random()*5+3,
      c:COLORS[(Math.random()*COLORS.length)|0],
      rot:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.3, life:1, decay:.008+Math.random()*.01});
  }
  if(!fxRunning){ fxRunning = true; requestAnimationFrame(tickFx); }
}
function tickFx(){
  fctx.clearRect(0,0,fx.width,fx.height);
  bits = bits.filter(b=>{
    b.vy += .28; b.vx *= .985; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life -= b.decay;
    if(b.life <= 0 || b.y > fx.height + 20) return false;
    fctx.save(); fctx.translate(b.x, b.y); fctx.rotate(b.rot);
    fctx.globalAlpha = Math.min(1, b.life*1.5); fctx.fillStyle = b.c;
    fctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);
    fctx.restore(); return true;
  });
  if(bits.length){ requestAnimationFrame(tickFx); }
  else { fxRunning = false; fctx.clearRect(0,0,fx.width,fx.height); }
}

/* ==================== CARDS ==================== */
const grid = document.getElementById("grid");
const filtersEl = document.getElementById("filters");
let activeTag = "All";
const fine = matchMedia("(pointer:fine)").matches;

function buildCards(){
  grid.innerHTML = "";
  for(const g of GAMES){
    const a = document.createElement("a");
    a.className = "card"; a.href = g.url; a.target = "_blank"; a.rel = "noopener";
    a.style.setProperty("--tint", g.tint);
    a.style.setProperty("--tint2", g.tint2);
    a.style.setProperty("--tint3", g.grad[0]);
    a.style.setProperty("--tint4", g.grad[1]);
    a.dataset.tags = g.tags.join(",");
    a.dataset.name = g.name;
    a.innerHTML =
      '<div class="icon">'+(g.img ? '<img src="'+g.img+'" alt="'+g.name+' gameplay screenshot">' : g.icon)+'</div>'+
      '<h2>'+g.name+'</h2>'+
      '<p>'+g.desc+'</p>'+
      '<div class="tags">'+g.tags.map(t=>'<span class="tag">'+t+'</span>').join("")+'</div>'+
      '<div class="play">PLAY <span class="arrow">→</span></div>';
    grid.appendChild(a);
    if(fine) attachTilt(a);
  }
  applyFilter();
}
function attachTilt(el){
  el.addEventListener("mousemove", e=>{
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left)/r.width, py = (e.clientY - r.top)/r.height;
    el.style.setProperty("--mx", (px*100)+"%");
    el.style.setProperty("--my", (py*100)+"%");
    el.style.transform = "perspective(900px) rotateX("+((.5-py)*10)+"deg) rotateY("+((px-.5)*14)+"deg) translateY(-4px)";
  });
  el.addEventListener("mouseleave", ()=>{ el.style.transform = ""; });
}

/* filters */
function buildFilters(){
  filtersEl.innerHTML = "";
  for(const t of ALL_TAGS){
    const b = document.createElement("button");
    b.className = "chip" + (t===activeTag ? " on" : "");
    b.textContent = t;
    b.addEventListener("click", ()=>{ activeTag = t; buildFilters(); applyFilter(); });
    filtersEl.appendChild(b);
  }
}
function applyFilter(){
  let shown = 0;
  for(const card of grid.children){
    const show = activeTag === "All" || card.dataset.tags.split(",").includes(activeTag);
    card.classList.toggle("hidden", !show);
    if(show){ shown++; card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop"); }
  }
  if(shown === 0) toast("No games in that genre yet 👀");
}

/* ==================== TOAST ==================== */
const toastEl = document.getElementById("toast");
let toastTimer;
function toast(msg, ms){
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  void toastEl.offsetWidth;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove("show"), ms || 2400);
}

/* ==================== SURPRISE ME ==================== */
document.getElementById("surprise").addEventListener("click", ()=>{
  const visible = [...grid.children].filter(c=>!c.classList.contains("hidden"));
  if(!visible.length) return;
  const pick = visible[(Math.random()*visible.length)|0];
  pick.scrollIntoView({behavior:"smooth", block:"center"});
  setTimeout(()=>{
    const r = pick.getBoundingClientRect();
    boom(r.left + r.width/2, r.top + r.height/2, 90);
    boom(r.left + r.width*.2, r.top, 40); boom(r.left + r.width*.8, r.top, 40);
    pick.classList.remove("pop"); void pick.offsetWidth; pick.classList.add("pop");
    toast("🎲 Fate chose: " + pick.dataset.name + " — click to play!");
  }, 450);
});

/* ==================== OPEN ALL ==================== */
document.getElementById("allPlay").addEventListener("click", ()=>{
  if(confirm("Open all " + GAMES.length + " games in new tabs?")){
    GAMES.forEach((g,i)=>setTimeout(()=>open(g.url,"_blank","noopener"), i*120));
    toast("🚀 Away we go!");
  }
});

/* ==================== KONAMI ==================== */
const seq = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
let ki = 0;
addEventListener("keydown", e=>{
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  ki = (k === seq[ki]) ? ki+1 : (k === seq[0] ? 1 : 0);
  if(ki === seq.length){
    ki = 0;
    for(let i=0;i<5;i++) setTimeout(()=>boom(Math.random()*innerWidth, Math.random()*innerHeight*.6, 60), i*160);
    toast("🎮 Cheat code accepted! You have excellent taste.");
  }
});

buildFilters();
buildCards();
</script>
</body>
</html>
